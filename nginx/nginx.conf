worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zone for auth endpoints to prevent brute-forcing
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream frontend_service {
        server frontend:3000;
    }

    upstream auth_service {
        server auth-service:4001;
    }

    upstream signaling_service {
        server signaling-service:4003;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Frontend Web Application (React + Vite)
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Auth Microservice (Email, OTP via SLM, JWT)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. WebSocket Signaling Gateway (Long-lived bidirectional channel)
        location /ws/ {
            proxy_pass http://signaling_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Extended timeouts for active call sessions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
